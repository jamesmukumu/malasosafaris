version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: malasoafricasafarisclient-dev
    ports:
      - "3000:3000"
    environment:
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-password}
      DB_DATABASE: ${DB_DATABASE:-malasoafricasafarisclient}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
    restart: unless-stopped
    networks:
      - malasoafricasafarisclient-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Optional: PostgreSQL database for local development
  # Uncomment if you want to run database locally
  # db:
  #   image: postgres:15-alpine
  #   container_name: malasoafricasafarisclient-db
  #   environment:
  #     POSTGRES_USER: ${DB_USER:-postgres}
  #     POSTGRES_PASSWORD: ${DB_PASS:-password}
  #     POSTGRES_DB: ${DB_DATABASE:-royalty}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   networks:
  #     - malasoafricasafarisclient-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  malasoafricasafarisclient-network:
    driver: bridge

